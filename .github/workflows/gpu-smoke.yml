name: FlashGuard GPU Smoke

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the exhaustive tuning/FPS/motion matrix
        required: true
        default: false
        type: boolean

concurrency:
  group: flashguard-gpu-test
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  gpu-smoke:
    runs-on: [self-hosted, Windows, X64, flashguard-gpu]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build and inspect GPU runtime
        id: gpu
        continue-on-error: true
        shell: powershell
        env:
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
        run: |
          $arguments = @(
            '-Mode', 'gpu-smoke',
            '-OutputDir', 'flashbench/results'
          )
          if ($env:FULL_MATRIX -eq 'true') {
            $arguments += '-TuneMatrix'
          }
          & .\flashbench\run.ps1 @arguments
          exit $LASTEXITCODE
      - name: Upload GPU smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flashbench-gpu-${{ github.sha }}
          path: flashbench/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stage tested build outside runner workspace
        if: steps.gpu.outcome == 'success'
        shell: powershell
        run: |
          $root = 'C:\FlashGuard-Tested'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dest = Join-Path $root '${{ github.sha }}'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force .\FlashGuard.exe (Join-Path $dest 'FlashGuard.exe')
          Set-Content -Path (Join-Path $root 'LATEST.txt') -Value (Join-Path $dest 'FlashGuard.exe')
      - name: Publish GPU smoke status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GPU_OUTCOME: ${{ steps.gpu.outcome }}
        run: |
          $state = if ($env:GPU_OUTCOME -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'FlashBench GPU smoke passed' } else { 'FlashBench GPU smoke failed' }
          $body = @{
            state = $state
            context = 'flashbench/gpu-smoke'
            description = $description
            target_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'FlashBench' } `
            -ContentType 'application/json' -Body $body | Out-Null
      - name: Fail workflow when GPU smoke failed
        if: steps.gpu.outcome != 'success'
        shell: powershell
        run: exit 1
